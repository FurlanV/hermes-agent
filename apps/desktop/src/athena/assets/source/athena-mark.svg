  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#ffffff"/>
  <rect x="102" y="102" width="820" height="820" rx="183" ry="183" fill="none" stroke="#c9d9ea" stroke-width="4"/>
  <image href="sickkids-logo.svg" x="172" y="402.67" width="680" height="218.67" preserveAspectRatio="xMidYMid meet"/>
</svg>
